imports:
    - { resource: local/*.yaml }
    - { resource: services.yaml }
    - { resource: license.yaml }


parameters:
    # Registration values come from .env.local (dev stack, instance registered at
    # license.pimcore.com) or from the repository secrets (CI, written to .env.local by
    # php-test). Pimcore refuses to boot without them; the empty defaults only keep the
    # container compilable when the variables are absent.
    env(PIMCORE_ENCRYPTION_SECRET): ''
    env(PIMCORE_INSTANCE_IDENTIFIER): ''
    env(PIMCORE_PRODUCT_KEY): ''

    env(DATABASE_VERSION): '8.0.26'
    env(MAILER_MAIN): ''
    env(MAILER_NEWSLETTER): ''
    mailer_main: '%env(MAILER_MAIN)%'
    mailer_newsletter: '%env(MAILER_NEWSLETTER)%'

# The connection itself comes from DATABASE_URL (.env / .env.local), which Pimcore's own config uses as `url`:
# doctrine-bundle >= 3.0 refuses host/port/dbname/user/password next to it (2.x only deprecates it).
doctrine:
    dbal:
        connections:
            default:
                charset: 'utf8mb4'
                mapping_types: { bit: boolean }
                server_version: '%env(DATABASE_VERSION)%'
